<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPHA x a0wno PS4 Host Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            background-image: url('watermarked_img_0.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ff0000;
            font-family: monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5vh;
        }

        h1 {
            font-size: 1.6em;
            text-shadow: 2px 2px #550000;
            background: rgba(0,0,0,0.92);
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #ff0000;
            letter-spacing: 2px;
        }

        #status {
            font-size: 0.95em;
            color: #ffff00;
            margin-top: 12px;
            white-space: pre-line;
            background: rgba(0,0,0,0.92);
            display: inline-block;
            padding: 12px 16px;
            max-width: 95vw;
            width: 900px;
            text-align: left;
            border: 1px solid #330000;
            min-height: 60px;
        }

        .loader {
            border: 4px solid #111;
            border-top: 4px solid red;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #exploit-frame {
            display: none;
            width: 100%;
            height: 100vh;
            border: none;
            position: fixed;
            top: 0; left: 0;
            z-index: 999;
            background: #000;
        }

        #manual-btn {
            display: none;
            margin-top: 14px;
            padding: 10px 28px;
            background: #1a0000;
            color: #ff4444;
            border: 1px solid #ff0000;
            font-family: monospace;
            font-size: 1em;
            cursor: pointer;
            letter-spacing: 1px;
        }

        #manual-btn:hover { background: #330000; }
    </style>
</head>
<body>

    <h1>⚡ A0WNO PAYLOAD HOST ENGINE ⚡</h1>
    <div class="loader" id="spinner"></div>
    <div id="status">جاري تهيئة بيئة الاستغلال ورصد المتصفح...</div>
    <button id="manual-btn" onclick="loadExploit()">▶ تشغيل الاستغلال يدوياً</button>

    <!-- g2all exploit loaded here -->
    <iframe id="exploit-frame"
            src=""
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
            allow="autoplay"></iframe>

    <script>
        var statusBox = document.getElementById("status");
        var spinner   = document.getElementById("spinner");
        var frame     = document.getElementById("exploit-frame");
        var manualBtn = document.getElementById("manual-btn");

        // رابط g2all الفعلي
        var G2ALL_URL = "https://gamerhack.github.io/g2all/";

        function log(msg) {
            statusBox.innerText += "\n" + msg;
        }

        function loadExploit() {
            log("[+] جاري تحميل g2all exploit engine...");
            frame.src = G2ALL_URL;
            frame.style.display = "block";
            spinner.style.display = "none";
            manualBtn.style.display = "none";
        }

        function startEngine() {
            var ua = navigator.userAgent;
            var isPS4 = ua.indexOf("PlayStation 4") !== -1;

            if (isPS4) {
                log("[+] ✓ تم رصد متصفح PlayStation 4.");
                log("[+] جاري الاتصال بمسار g2all...");
                setTimeout(loadExploit, 1500);
            } else {
                log("[!] المتصفح الحالي: " + ua.substring(0, 60) + "...");
                log("[!] هذه الصفحة مخصصة لـ PS4 — لكن يمكنك التشغيل يدوياً.");
                spinner.style.display = "none";
                manualBtn.style.display = "inline-block";
            }
        }

        window.onload = function () {
            setTimeout(startEngine, 800);
        };
    </script>

</body>
</html>
